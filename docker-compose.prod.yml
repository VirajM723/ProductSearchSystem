# Everything for the production server: MongoDB, Elasticsearch, the API and
# Caddy (web server + automatic HTTPS). Only Caddy is reachable from outside.
#
#   cp .env.production.example .env   # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: productsearch
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      # Elasticsearch is only reachable on the private Docker network, so
      # the connection from the API isn't encrypted. Passwords are still required.
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=false
      # Disk limits as sizes rather than percentages, which suit a small
      # single-disk VM better (the 90% default can trip on a 50 GB volume).
      - cluster.routing.allocation.disk.watermark.low=2gb
      - cluster.routing.allocation.disk.watermark.high=1gb
      - cluster.routing.allocation.disk.watermark.flood_stage=500mb
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  # One-off job that creates the limited Elasticsearch user for the API.
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    entrypoint: ["/bin/sh", "/setup.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_APP_PASSWORD: ${ES_APP_PASSWORD:?set ES_APP_PASSWORD in .env}
    volumes:
      - ./deploy/es-setup.sh:/setup.sh:ro
    networks: [internal]
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://app:${MONGO_APP_PASSWORD}@mongo:27017/productsearch?authSource=productsearch
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: product_search_app
      ELASTICSEARCH_PASSWORD: ${ES_APP_PASSWORD}
      ES_INDEX: products
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: 1
    networks: [internal, public]
    depends_on:
      mongo: { condition: service_healthy }
      es-setup: { condition: service_completed_successfully }

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [public]
    depends_on: [api]

networks:
  # No internet access and no ports on the host: only the API can reach
  # MongoDB and Elasticsearch.
  internal:
    internal: true
  public:

volumes:
  mongo-data:
  es-data:
  caddy-data:
  caddy-config:
